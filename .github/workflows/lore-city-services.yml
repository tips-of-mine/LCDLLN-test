# Validation des services des villes et de leurs PNJ dans le fichier de lore
# (legacy/world-builder-html/lune-noire-data*.json).
#
# - validate_city_services.py : conformité à la grille par taille
#   (game_design.cities_services.grille), unicité des PNJ, aucun nom des BD,
#   les deux copies du fichier identiques ;
# - generate_city_services.py --check : le fichier est bien à jour par rapport
#   au générateur (à relancer après toute modification de la grille) ;
# - sync_levels.py --check (v1.0.118) : niveaux de référence des régions du lore
#   recopiés au master (clé levels des regions, couleur du nom de zone) ;
# - sync_positions.py --check (v1.0.95) : les positions posées à la main dans
#   l'éditeur (position_x_m / position_z_m des villes et lieux) sont recopiées
#   dans game/data/world/royaumes/world_master.json (clé position) ;
# - sync_routes.py --check (v1.0.105) : les routes du lore (collection routes, tracées
#   dans l'éditeur) sont recopiées dans world_master.json (clé lore_roads), que
#   tools/world_gen suit case par case ; test_sync_routes.py vérifie le script
#   (--check, idempotence, routes maritimes ignorées) sur des copies ;
# - check_secrets.py (v1.0.110) : les villes et lieux `secret: true` du lore le sont
#   aussi au master (cachés de places.json, écrits dans secret_places.json réservé
#   au serveur), aucune route du lore ne mène à un lieu secret ;
# - check_references.py --strict (v1.0.103, bloquant depuis v1.0.115) : aucune référence
#   vers un identifiant inexistant (fiches du lore, villes et lieux du master des Enfers,
#   mot-clé monde_entier).
#
# Ne lance que du Python standard, ~10 s. Indépendant des builds.
name: Lore — services des villes
on:
  push:
    branches: [develop, main]
    paths:
      - 'legacy/world-builder-html/lune-noire-data*.json'
      - 'tools/lore/**'
      - 'game/data/world/royaumes/world_master.json'
      - 'game/data/world/enfers/world_master.json'
      - 'game/data/races/factions.json'
      - '.github/workflows/lore-city-services.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'legacy/world-builder-html/lune-noire-data*.json'
      - 'tools/lore/**'
      - 'game/data/world/royaumes/world_master.json'
      - 'game/data/world/enfers/world_master.json'
      - 'game/data/races/factions.json'
      - '.github/workflows/lore-city-services.yml'

permissions:
  contents: read

jobs:
  city-services:
    name: Services et PNJ des villes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conformité à la grille
        run: python tools/lore/validate_city_services.py

      - name: Fichier à jour par rapport au générateur
        run: python tools/lore/generate_city_services.py --check

      - name: Positions manuelles recopiées au master
        run: python tools/lore/sync_positions.py --check

      - name: Niveaux des régions recopiés au master
        run: python tools/lore/sync_levels.py --check

      - name: Routes du lore recopiées au master
        run: python tools/lore/sync_routes.py --check

      - name: Test du script de recopie des routes
        run: python tools/lore/test_sync_routes.py

      - name: Lieux secrets concordants (lore ↔ master)
        run: python tools/lore/check_secrets.py

      - name: Aucune référence orpheline
        run: python tools/lore/check_references.py --strict
